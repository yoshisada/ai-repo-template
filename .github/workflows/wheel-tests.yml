name: wheel-tests

# plugin-wheel is now a git submodule (github.com/yoshisada/wheel) with its OWN
# CI (build + vitest, and — follow-up — the bash/bats hook + preprocessor
# tests). Wheel-internal jobs that used to live here moved to that repo.
#
# What remains here are the cross-plugin canaries that operate on MONOREPO
# files and therefore need no submodule checkout / Node / PAT:
#   - SC-007 / SC-F-6 / FR-G3-5: regression-fingerprint + residual-token grep
#     over .kiln/logs/ and .wheel/history/ added lines.
#
# Dropped on extraction:
#   - Wheel TS build + FR-C2/FR-C1/preprocessor tests → now in the wheel repo CI.
#   - The NFR-G-6 atomic-migration guard referenced plugin-wheel/lib/resolve_inputs.sh,
#     which now lives in the wheel repo — the in-monorepo invariant no longer applies.
# See docs/features/2026-06-22-wheel-submodule-extraction/PLAN.md (two-repo CI split).

on:
  pull_request:
    paths:
      - '.kiln/logs/**'
      - '.wheel/history/**'
      - '.github/workflows/wheel-tests.yml'
  push:
    branches:
      - main
    paths:
      - '.kiln/logs/**'
      - '.wheel/history/**'

permissions:
  contents: read

jobs:
  cross-plugin-canaries:
    name: SC-007 regression-fingerprint + residual-token log grep
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: SC-007 + SC-F-6 + FR-G3-5 log grep assertions
        run: |
          # Any log/state line ADDED on this branch MUST NOT contain the
          # regression fingerprint OR a residual plugin-path / {{VAR}} token.
          # Stale pre-existing lines are exempt — we diff against the merge base.
          BASE_REF="${GITHUB_BASE_REF:-main}"
          git fetch --no-tags origin "$BASE_REF" --unshallow 2>/dev/null \
            || git fetch --no-tags origin "$BASE_REF" 2>/dev/null \
            || true
          MERGE_BASE=$(git merge-base "origin/${BASE_REF}" HEAD 2>/dev/null) || MERGE_BASE=""
          if [ -z "$MERGE_BASE" ]; then
            echo "::warning::Could not determine merge base with origin/${BASE_REF}; falling back to HEAD~1"
            MERGE_BASE="HEAD~1"
          fi

          if [ -d .kiln/logs ]; then
            if git diff "$MERGE_BASE"..HEAD -- '.kiln/logs/report-issue-bg-*.md' \
                | grep -E '^\+[^+].*WORKFLOW_PLUGIN_DIR was unset' >/dev/null 2>&1; then
              echo "::error::SC-007 regression: a line added on this branch contains 'WORKFLOW_PLUGIN_DIR was unset' in .kiln/logs/report-issue-bg-*.md"
              exit 1
            fi
          fi

          if [ -d .wheel/history/success ]; then
            if git diff "$MERGE_BASE"..HEAD -- '.wheel/history/success/*.json' \
                | grep -E '^\+[^+].*\$\{(WHEEL_PLUGIN_|WORKFLOW_PLUGIN_DIR)' >/dev/null 2>&1; then
              echo "::error::SC-F-6 regression: residual plugin-path token added in .wheel/history/success/*.json"
              exit 1
            fi
            if git diff "$MERGE_BASE"..HEAD -- '.wheel/history/success/*.json' \
                | grep -E '^\+[^+].*\{\{[A-Z][A-Z0-9_]*\}\}' >/dev/null 2>&1; then
              echo "::error::FR-G3-5 regression: residual {{VAR}} placeholder added in .wheel/history/success/*.json"
              exit 1
            fi
          fi

          echo "SC-007 + SC-F-6 + FR-G3-5 grep clean (merge-base: $MERGE_BASE)"
